name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gridbricks
          POSTGRES_PASSWORD: gridbricks
          POSTGRES_DB: gridbricks_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gridbricks -d gridbricks_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://gridbricks:gridbricks@localhost:5432/gridbricks_test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: docker compose config --quiet
      - run: docker build --target worker -t gridbricks-worker .
