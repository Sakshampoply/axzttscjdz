[project]
name = "gridbricks"
version = "1.0.0"
description = "Decision-time wind forecast intelligence with continuous Elexon synchronisation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "pandas>=2.2,<4",
  "numpy>=2.0,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requires an isolated PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
