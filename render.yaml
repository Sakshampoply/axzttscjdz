databases:
  - name: gridbricks-db
    databaseName: gridbricks
    user: gridbricks
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: gridbricks-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: 0.5c-512mb
    healthCheckPath: /health
    preDeployCommand: python -m app.cli migrate
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gridbricks-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SYNC_INTERVAL_SECONDS
        value: "120"
  - type: worker
    name: gridbricks-sync
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m app.cli worker
    region: frankfurt
    plan: 0.5c-512mb
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gridbricks-db
          property: connectionString
      - key: SYNC_INTERVAL_SECONDS
        value: "120"
      - key: BOOTSTRAP_HISTORY_DAYS
        value: "30"
      - key: BOOTSTRAP_DEMO
        value: "true"
