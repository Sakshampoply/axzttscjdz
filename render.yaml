# Free resources only. Render Free Postgres expires after 30 days.
databases:
  - name: gridbricks-db
    databaseName: gridbricks
    user: gridbricks
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: gridbricks-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gridbricks-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SYNC_INTERVAL_SECONDS
        value: "300"
      - key: REQUEST_DRIVEN_SYNC
        value: "true"
      - key: BOOTSTRAP_HISTORY_DAYS
        value: "30"
      - key: BOOTSTRAP_DEMO
        value: "true"
